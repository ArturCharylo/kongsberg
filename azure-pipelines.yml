trigger:
  - master

variables:
  - group: km

stages:

# ==================================================
# PREPARATION
# ==================================================
- stage: Preparation
  displayName: Preparation

  jobs:
  - job: Prepare
    pool:
      name: Default

    steps:
    - checkout: self

    - powershell: |
        docker compose -p km-praktyki down --remove-orphans

        $containers = @(
          docker ps -aq --filter "publish=5173"
          docker ps -aq --filter "publish=8000"
          docker ps -aq --filter "publish=5432"
          docker ps -aq --filter "publish=9090"
          docker ps -aq --filter "publish=3000"
          docker ps -aq --filter "publish=8080"
          docker ps -aq --filter "publish=9091"
        ) | Where-Object { $_ } | Sort-Object -Unique

        if ($containers) {
          docker rm -f $containers
        }
      displayName: Stop previous application containers

# ==================================================
# BUILD
# ==================================================
- stage: Build
  displayName: Build Application Stack
  dependsOn: Preparation

  jobs:
  - job: Build
    pool:
      name: Default

    steps:

    - task: AzureKeyVault@2
      displayName: Download certificate from Key Vault
      inputs:
        azureSubscription: 'key-vault'
        KeyVaultName: 'kongsberg'
        SecretsFilter: 'delivery'
        RunAsPreJob: true

    - powershell: |
        $secret = "$(delivery)"

        Write-Host "Length: $($secret.Length)"

        if ($secret.Length -gt 20)
        {
          Write-Host "Prefix:"
          Write-Host $secret.Substring(0,20)
        }
      displayName: Inspect secret

    - powershell: |
        $certDir = "$(Build.SourcesDirectory)\km_Praktyki\certs"

        New-Item -ItemType Directory -Force -Path $certDir

        [System.IO.File]::WriteAllBytes(
          "$certDir\delivery.pfx",
          [System.Convert]::FromBase64String("$(delivery)")
        )

        Get-ChildItem $certDir
      displayName: Save PFX

    - powershell: |
        $certDir = "$(Build.SourcesDirectory)\km_Praktyki\certs"

        openssl pkcs12 `
          -in "$certDir\delivery.pfx" `
          -clcerts `
          -nokeys `
          -out "$certDir\delivery.crt" `
          -passin pass:

        openssl pkcs12 `
          -in "$certDir\delivery.pfx" `
          -cacerts `
          -nokeys `
          -out "$certDir\Artur.crt" `
          -passin pass:

        Get-Content `
          "$certDir\delivery.crt",
          "$certDir\Artur.crt" |
        Set-Content "$certDir\fullchain.crt"
      displayName: Extract Full Chain

    - powershell: |
        dir "$(Build.SourcesDirectory)\km_Praktyki\certs"
        Get-Content "$(Build.SourcesDirectory)\km_Praktyki\certs\delivery.crt" -Head 5
      displayName: Check certs

    - powershell: |
        $certDir = "$(Build.SourcesDirectory)\km_Praktyki\certs"

        openssl pkcs12 `
          -in "$certDir\delivery.pfx" `
          -nocerts `
          -nodes `
          -out "$certDir\delivery.key" `
          -passin pass:

        if ($LASTEXITCODE -ne 0)
        {
          throw "KEY extraction failed"
        }
      displayName: Extract KEY

    - powershell: |
        $certDir = "$(Build.SourcesDirectory)\km_Praktyki\certs"

        Write-Host "Certificate directory contents:"
        Get-ChildItem $certDir

        Test-Path "$certDir\delivery.crt"
        Test-Path "$certDir\delivery.key"

        openssl x509 `
          -in "$certDir\delivery.crt" `
          -noout `
          -subject
      displayName: Verify certificate

    - powershell: |
        docker compose -p km-praktyki build --pull

        if ($LASTEXITCODE -ne 0)
        {
          exit $LASTEXITCODE
        }
      displayName: Build application stack

# ==================================================
# TESTS AND COVERAGE
# ==================================================
- stage: Tests
  displayName: Tests and Code Coverage
  dependsOn: Build

  jobs:
  - job: Tests
    pool:
      name: Default

    steps:
    - powershell: |
        python -m pip install -r "$(Build.SourcesDirectory)\backend\requirements-test.txt"
      displayName: Install backend test dependencies

    - powershell: |
        Set-Location "$(Build.SourcesDirectory)"
        python -m pytest backend/tests `
          --cov=backend `
          --cov-report=term `
          --cov-report=html:backend\htmlcov `
          --cov-report=xml:backend\coverage.xml `
          --cov-report=json:backend\coverage.json `
          --junitxml=backend\test-results.xml
      displayName: Run backend tests with coverage

    - task: PublishTestResults@2
      displayName: Publish backend test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'backend/test-results.xml'
        testRunTitle: Backend tests
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish backend coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/backend/coverage.xml'
        pathToSources: '$(Build.SourcesDirectory)'
        reportDirectory: '$(Build.SourcesDirectory)/backend/htmlcov'
        failIfCoverageEmpty: true

    - powershell: |
        Set-Location "$(Build.SourcesDirectory)\km_Praktyki"
        npm ci
        npm run test:coverage -- --reporter=junit --outputFile=test-results\frontend-junit.xml
      displayName: Run frontend tests with coverage

    - powershell: |
        Set-Location "$(Build.SourcesDirectory)\km_Praktyki"
        npm run lint -- --format json --output-file eslint-report.json
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ESLint found issues. The report will still be published."
          exit $LASTEXITCODE
        }
      displayName: Run frontend static code analysis
      condition: succeededOrFailed()

    - powershell: |
        Set-Location "$(Build.SourcesDirectory)"
        python km_Praktyki\scripts\eslint_to_prometheus.py `
          km_Praktyki\eslint-report.json `
          web-static-analysis-metrics.prom
      displayName: Generate static analysis metrics
      condition: succeededOrFailed()

    - task: PublishBuildArtifacts@1
      displayName: Publish frontend static analysis report
      condition: succeededOrFailed()
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)\km_Praktyki\eslint-report.json'
        artifactName: frontend-static-analysis-report
        artifactType: container

    - task: PublishBuildArtifacts@1
      displayName: Publish static analysis metrics
      condition: succeededOrFailed()
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)\web-static-analysis-metrics.prom'
        artifactName: web-static-analysis-metrics
        artifactType: container

    - task: PublishTestResults@2
      displayName: Publish frontend test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'km_Praktyki/test-results/frontend-junit.xml'
        testRunTitle: Frontend tests
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish frontend coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/km_Praktyki/coverage/cobertura-coverage.xml'
        pathToSources: '$(Build.SourcesDirectory)/km_Praktyki'
        reportDirectory: '$(Build.SourcesDirectory)/km_Praktyki/coverage'
        failIfCoverageEmpty: true

    - powershell: |
        New-Item -ItemType Directory -Force -Path "test-and-coverage-reports" | Out-Null

        @'
        import json
        from pathlib import Path

        backend = json.loads(Path('backend/coverage.json').read_text())
        frontend = json.loads(Path('km_Praktyki/coverage/coverage-summary.json').read_text())

        backend_percent = round(backend['totals']['percent_covered'], 2)
        frontend_percent = round(frontend['total']['lines']['pct'], 2)
        average_percent = round((backend_percent + frontend_percent) / 2, 2)

        Path('test-coverage-summary.md').write_text(
            '\n'.join([
                '# Test and Code Coverage Summary',
                '',
                '| Area | Tests | Line coverage |',
                '| --- | ---: | ---: |',
                f'| Backend | pytest | {backend_percent}% |',
                f'| Frontend | Vitest | {frontend_percent}% |',
                f'| Average | | {average_percent}% |',
                '',
                'Detailed JUnit and coverage reports are available in the published pipeline results and artifacts.',
                '',
            ]),
            encoding='utf-8',
        )
        '@ | python -

        Copy-Item -Path "backend\test-results.xml" -Destination "test-and-coverage-reports" -Force
        Copy-Item -Path "backend\coverage.xml" -Destination "test-and-coverage-reports" -Force
        Copy-Item -Path "backend\coverage.json" -Destination "test-and-coverage-reports" -Force
        Copy-Item -Path "km_Praktyki\test-results\frontend-junit.xml" -Destination "test-and-coverage-reports" -Force
        Copy-Item -Path "km_Praktyki\coverage\coverage-summary.json" -Destination "test-and-coverage-reports" -Force
        Copy-Item -Path "test-coverage-summary.md" -Destination "test-and-coverage-reports" -Force

        Write-Host "##vso[task.uploadsummary]$(Build.SourcesDirectory)\test-coverage-summary.md"
      displayName: Add coverage to Pipeline Summary
      condition: succeededOrFailed()

    - task: PublishBuildArtifacts@1
      displayName: Publish test and coverage reports
      condition: succeededOrFailed()
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)\test-and-coverage-reports'
        artifactName: test-and-coverage-reports
        artifactType: container

# ==================================================
# SECURITY
# ==================================================
- stage: SecurityScan
  displayName: Security Scan
  dependsOn: Tests

  jobs:
  - job: Scan
    pool:
      name: Default

    steps:

    # Raporty Trivy
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format json --output trivy-api-report.json km-praktyki-api:latest
      displayName: Generate API report
      condition: always()

    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format json --output trivy-frontend-report.json km-praktyki-frontend:latest
      displayName: Generate Frontend report
      condition: always()

    # SBOM dla obrazow aplikacyjnych
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format cyclonedx --output sbom-api.json km-praktyki-api:latest
      displayName: Generate API SBOM
      condition: always()

    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format cyclonedx --output sbom-frontend.json km-praktyki-frontend:latest
      displayName: Generate Frontend SBOM
      condition: always()

    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe fs --format json --output trivy-source-report.json .
      displayName: Generate Source Code report
      condition: always()

    # Scan API
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 km-praktyki-api:latest
      displayName: Scan API

    # Scan Frontend
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 km-praktyki-frontend:latest
      displayName: Scan Frontend

    # Scan Source
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe fs --severity HIGH,CRITICAL --exit-code 0 .
      displayName: Scan Source Code Dependencies

    - powershell: |
        $critical = 0
        $high = 0
        $medium = 0
        $low = 0

        $reports = @(
            "trivy-api-report.json",
            "trivy-frontend-report.json",
            "trivy-source-report.json"
        )

        foreach ($file in $reports)
        {
            $json = Get-Content $file -Raw | ConvertFrom-Json

            foreach ($result in $json.Results)
            {
                foreach ($vuln in $result.Vulnerabilities)
                {
                    switch ($vuln.Severity)
                    {
                        "CRITICAL" { $critical++ }
                        "HIGH"     { $high++ }
                        "MEDIUM"   { $medium++ }
                        "LOW"      { $low++ }
                    }
                }
            }
        }

        Write-Host "Critical: $critical"
        Write-Host "High: $high"

        Write-Host "##vso[task.setvariable variable=CriticalCount;isOutput=true]$critical"
        Write-Host "##vso[task.setvariable variable=HighCount;isOutput=true]$high"
      displayName: Count Vulnerabilities
      name: ParseReports

    - powershell: |
        $metricsFile = "trivy-metrics.prom"

        if (Test-Path $metricsFile) {
            Remove-Item $metricsFile
        }

        $reports = @{
            "api" = "trivy-api-report.json"
            "frontend" = "trivy-frontend-report.json"
            "source" = "trivy-source-report.json"
        }

        $allMetrics = @()
        foreach ($image in $reports.Keys)
        {
            $json = Get-Content $reports[$image] -Raw | ConvertFrom-Json

            $critical = 0
            $high = 0
            $medium = 0
            $low = 0

            foreach ($result in $json.Results)
            {
                foreach ($vuln in $result.Vulnerabilities)
                {
                    switch ($vuln.Severity)
                    {
                        "CRITICAL" { $critical++ }
                        "HIGH"     { $high++ }
                        "MEDIUM"   { $medium++ }
                        "LOW"      { $low++ }
                    }
                }
            }

            $allMetrics += "trivy_vulnerabilities_total{image=`"$image`",severity=`"critical`"} $critical"
            $allMetrics += "trivy_vulnerabilities_total{image=`"$image`",severity=`"high`"} $high"
            $allMetrics += "trivy_vulnerabilities_total{image=`"$image`",severity=`"medium`"} $medium"
            $allMetrics += "trivy_vulnerabilities_total{image=`"$image`",severity=`"low`"} $low"
        }

        $content = ($allMetrics -join "`n") + "`n"

        [System.IO.File]::WriteAllText(
            $metricsFile,
            $content,
            [System.Text.UTF8Encoding]::new($false)
        )

        if (Test-Path trivy-metrics.prom)
        {
            Get-Content trivy-metrics.prom
            Get-ChildItem -Recurse $(Pipeline.Workspace)
        }
        else
        {
            Write-Error "Metrics file was not created!"
        }

      displayName: Generate Prometheus Metrics

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: trivy-metrics.prom
        artifactName: trivy-metrics

        # Collect reports
    - powershell: |
        New-Item -ItemType Directory -Force -Path trivy-reports

        Move-Item trivy-api-report.json trivy-reports
        Move-Item trivy-frontend-report.json trivy-reports
        Move-Item trivy-source-report.json trivy-reports
      displayName: Collect Security Reports
      condition: always()

    # Publish reports
    - task: PublishBuildArtifacts@1
      displayName: Publish Security Reports
      condition: always()
      inputs:
        pathToPublish: trivy-reports
        artifactName: security-reports

    - powershell: |
        New-Item -ItemType Directory -Force -Path sbom-reports

        Move-Item sbom-api.json sbom-reports
        Move-Item sbom-frontend.json sbom-reports
      displayName: Collect SBOM Reports
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Publish SBOM Reports
      condition: always()
      inputs:
        pathToPublish: sbom-reports
        artifactName: sbom-reports

    - powershell: |
        function Escape-PrometheusLabel {
            param([AllowNull()][string]$Value)

            if ($null -eq $Value) {
                return ""
            }

            return $Value.Replace('\', '\\').Replace('"', '\"').Replace("`r", '\r').Replace("`n", '\n')
        }

        $sboms = @{
            "api" = "sbom-reports\sbom-api.json"
            "frontend" = "sbom-reports\sbom-frontend.json"
        }

        $metrics = @()
        foreach ($image in $sboms.Keys) {
            $sbom = Get-Content $sboms[$image] -Raw | ConvertFrom-Json
            $components = @($sbom.components)

            foreach ($component in $components) {
                $package = Escape-PrometheusLabel $component.name
                $version = Escape-PrometheusLabel $component.version
                $escapedImage = Escape-PrometheusLabel $image
                $metrics += 'sbom_component_info{image="' + $escapedImage + '",package="' + $package + '",version="' + $version + '"} 1'
            }

            $escapedImage = Escape-PrometheusLabel $image
            $componentCount = $components.Count
            $metrics += 'sbom_components_total{image="' + $escapedImage + '"} ' + $componentCount
        }

        $content = ($metrics -join "`n") + "`n"
        [System.IO.File]::WriteAllText(
            "sbom-metrics.prom",
            $content,
            [System.Text.UTF8Encoding]::new($false)
        )

        Get-Content sbom-metrics.prom -Head 20
      displayName: Generate SBOM Prometheus Metrics
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Publish SBOM Metrics
      condition: always()
      inputs:
        pathToPublish: sbom-metrics.prom
        artifactName: sbom-metrics

    - task: PublishBuildArtifacts@1
      displayName: Publish Grafana Monitoring Configuration
      condition: succeededOrFailed()
      inputs:
        pathToPublish: monitoring
        artifactName: grafana-monitoring

# ==================================================
# DEPLOY
# ==================================================
- stage: Deploy
  displayName: Deploy Application
  dependsOn: SecurityScan

  jobs:
  - job: Deploy
    pool:
      name: Default

    steps:
    - task: DownloadBuildArtifacts@0
      displayName: Download Grafana Monitoring Configuration
      inputs:
        artifactName: grafana-monitoring

    - task: DownloadBuildArtifacts@0
      displayName: Download SBOM Metrics
      inputs:
        artifactName: sbom-metrics

    - task: DownloadBuildArtifacts@0
      displayName: Download Static Analysis Metrics
      inputs:
        artifactName: web-static-analysis-metrics

    - powershell: |
        $monitoringSource = "$(System.ArtifactsDirectory)\grafana-monitoring"
        $monitoringTarget = "$(Build.SourcesDirectory)\monitoring"

        Copy-Item "$monitoringSource\*" $monitoringTarget -Recurse -Force
        Get-ChildItem $monitoringTarget -Recurse
      displayName: Install Grafana Monitoring Configuration

    - powershell: |
        docker compose -p km-praktyki up -d

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        openssl s_client -connect localhost:5173 -showcerts
      displayName: Run application stack

    - task: DownloadBuildArtifacts@0
      inputs:
        artifactName: trivy-metrics

    - powershell: |
        $metricsFile = "$(System.ArtifactsDirectory)\trivy-metrics\trivy-metrics.prom"

        Test-Path $metricsFile
        $content = Get-Content $metricsFile -Raw

        $wc = New-Object System.Net.WebClient
        $wc.Headers.Add("Content-Type","text/plain")
        $wc.UploadString(
            "http://localhost:9091/metrics/job/trivy-scan",
            "POST",
            $content
        )
      displayName: Push Metrics To Pushgateway

    - powershell: |
        $metricsFile = "$(System.ArtifactsDirectory)\sbom-metrics\sbom-metrics.prom"

        Test-Path $metricsFile
        $content = Get-Content $metricsFile -Raw

        $wc = New-Object System.Net.WebClient
        $wc.Headers.Add("Content-Type", "text/plain")
        $wc.UploadString(
            "http://localhost:9091/metrics/job/sbom-scan",
            "POST",
            $content
        )
      displayName: Push SBOM Metrics To Pushgateway

    - powershell: |
        $metricsFile = "$(System.ArtifactsDirectory)\web-static-analysis-metrics\web-static-analysis-metrics.prom"

        if (-not (Test-Path $metricsFile)) {
          throw "Static analysis metrics file was not found: $metricsFile"
        }

        $content = Get-Content $metricsFile -Raw
        $wc = New-Object System.Net.WebClient
        $wc.Headers.Add("Content-Type", "text/plain")
        $wc.UploadString(
            "http://localhost:9091/metrics/job/web-static-analysis",
            "POST",
            $content
        )
      displayName: Push Static Analysis Metrics To Pushgateway

# ==================================================
# PUSH TO DEV
# ==================================================

- stage: PushDev
  displayName: Push Images To DEV
  dependsOn: Deploy

  jobs:
  - job: Push
    pool:
      name: Default

    steps:

    - powershell: |
        docker tag km-praktyki-api:latest knsberg.azurecr.io/praktyki-api:$(Build.BuildId)

        docker tag km-praktyki-frontend:latest knsberg.azurecr.io/praktyki-frontend:$(Build.BuildId)

        docker tag grafana/grafana-enterprise:latest knsberg.azurecr.io/praktyki-grafana:$(Build.BuildId)

        docker tag postgres:16-alpine knsberg.azurecr.io/praktyki-postgres:$(Build.BuildId)

        docker tag prom/prometheus:latest knsberg.azurecr.io/praktyki-prom:$(Build.BuildId)
      displayName: Tag images for DEV

    - task: Docker@2
      displayName: Push API DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-api
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Frontend DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-frontend
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push DB DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-postgres
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Prometheus DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-prom
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Grafana DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-grafana
        tags: |
          $(Build.BuildId)

# ==================================================
# PUSH TO DEV
# ==================================================

- stage: PushProd
  displayName: Push Images to PROD
  condition: and(succeeded(), eq( stageDependencies.SecurityScan.Scan.outputs['ParseReports.CriticalCount'],'0' ))
  dependsOn:
   - PushDev
   - SecurityScan
  jobs:
  - job: PushProd
    pool:
      name: Default

    steps:

    - powershell: |
        docker tag km-praktyki-api:latest kmprod.azurecr.io/praktyki-api:$(Build.BuildId)

        docker tag km-praktyki-frontend:latest kmprod.azurecr.io/praktyki-frontend:$(Build.BuildId)

        docker tag grafana/grafana-enterprise:latest kmprod.azurecr.io/praktyki-grafana:$(Build.BuildId)

        docker tag postgres:16-alpine kmprod.azurecr.io/praktyki-postgres:$(Build.BuildId)

        docker tag prom/prometheus:latest kmprod.azurecr.io/praktyki-prom:$(Build.BuildId)
      displayName: Tag images for PROD

    - task: Docker@2
      displayName: Push API PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-api
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Frontend PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-frontend
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push DB PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-postgres
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Prometheus PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-prom
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Grafana PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-grafana
        tags: |
          $(Build.BuildId)

# ==================================================
# DIAGNOSTICS
# ==================================================
- stage: Diagnostics
  displayName: Diagnostics
  dependsOn:
  - PushDev

  jobs:
  - job: Diagnostics
    pool:
      name: Default

    steps:
    - powershell: |
        docker images
        docker ps -a
      displayName: Diagnostics