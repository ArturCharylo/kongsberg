trigger:
  - master

pool:
  name: Default

steps:
- checkout: self

- task: Docker@2
  displayName: Build image
  inputs:
    command: build
    repository: km-praktyki
    Dockerfile: km_Praktyki/Dockerfile
    tags: |
      latest
      $(Build.BuildId)

- powershell: |
    docker ps -aq --filter "name=km-praktyki-app" | ForEach-Object {
    docker stop $_
    docker rm $_
    }

    docker run -d `
      --name km-praktyki-app `
      -p 5173:80 `
      km-praktyki:$(Build.BuildId)
  displayName: Run container

- powershell: |
    docker images
    docker ps -a
  displayName: Diagnostics