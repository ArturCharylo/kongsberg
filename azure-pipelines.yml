trigger:
  - master

stages:

# ==================================================
# PREPARATION
# ==================================================
- stage: Preparation
  displayName: Preparation

  jobs:
  - job: Prepare
    pool:
      name: Default

    steps:
    - checkout: self

    - powershell: |
        docker compose -p km-praktyki down --remove-orphans

        $containers = @(
          docker ps -aq --filter "publish=5173"
          docker ps -aq --filter "publish=8000"
          docker ps -aq --filter "publish=5432"
          docker ps -aq --filter "publish=9090"
          docker ps -aq --filter "publish=3000"
        ) | Where-Object { $_ } | Sort-Object -Unique

        if ($containers) {
          docker rm -f $containers
        }
      displayName: Stop previous application containers

# ==================================================
# BUILD
# ==================================================
- stage: Build
  displayName: Build Application Stack
  dependsOn: Preparation

  jobs:
  - job: Build
    pool:
      name: Default

    steps:
    - powershell: |
        docker compose -p km-praktyki build --pull

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
      displayName: Build application stack

# ==================================================
# SECURITY
# ==================================================
- stage: SecurityScan
  displayName: Security Scan
  dependsOn: Build

  jobs:
  - job: Scan
    pool:
      name: Default

    steps:

    # Raporty Trivy
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format json --output trivy-api-report.json km-praktyki-api:latest
      displayName: Generate API report
      condition: always()

    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --format json --output trivy-frontend-report.json km-praktyki-frontend:latest
      displayName: Generate Frontend report
      condition: always()

    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe fs --format json --output trivy-source-report.json .
      displayName: Generate Source Code report
      condition: always()

    # Scan API
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 km-praktyki-api:latest
      displayName: Scan API

    # Scan Frontend
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 km-praktyki-frontend:latest
      displayName: Scan Frontend

    # Scan Source
    - script: |
        C:\ProgramData\chocolatey\bin\trivy.exe fs --severity HIGH,CRITICAL --exit-code 0 .
      displayName: Scan Source Code Dependencies

    - powershell: |
        $critical = 0
        $high = 0
        $medium = 0
        $low = 0

        $reports = @(
            "trivy-api-report.json",
            "trivy-frontend-report.json",
            "trivy-source-report.json"
        )

        foreach ($file in $reports)
        {
            $json = Get-Content $file -Raw | ConvertFrom-Json

            foreach ($result in $json.Results)
            {
                foreach ($vuln in $result.Vulnerabilities)
                {
                    switch ($vuln.Severity)
                    {
                        "CRITICAL" { $critical++ }
                        "HIGH"     { $high++ }
                        "MEDIUM"   { $medium++ }
                        "LOW"      { $low++ }
                    }
                }
            }
        }

        Write-Host "Critical: $critical"
        Write-Host "High: $high"

        Write-Host "##vso[task.setvariable variable=CriticalCount;isOutput=true]$critical"
        Write-Host "##vso[task.setvariable variable=HighCount;isOutput=true]$high"
      displayName: Count Vulnerabilities
      name: ParseReports

    - powershell: |
        $metricsFile = "trivy-metrics.prom"

        if (Test-Path $metricsFile) {
            Remove-Item $metricsFile
        }

        $reports = @{
            "api" = "trivy-api-report.json"
            "frontend" = "trivy-frontend-report.json"
            "source" = "trivy-source-report.json"
        }

        foreach ($image in $reports.Keys)
        {
            $json = Get-Content $reports[$image] -Raw | ConvertFrom-Json

            $critical = 0
            $high = 0
            $medium = 0
            $low = 0

            foreach ($result in $json.Results)
            {
                foreach ($vuln in $result.Vulnerabilities)
                {
                    switch ($vuln.Severity)
                    {
                        "CRITICAL" { $critical++ }
                        "HIGH"     { $high++ }
                        "MEDIUM"   { $medium++ }
                        "LOW"      { $low++ }
                    }
                }
            }

            Add-Content $metricsFile "trivy_vulnerabilities_total{image=`"$image`",severity=`"critical`"} $critical"
            Add-Content $metricsFile "trivy_vulnerabilities_total{image=`"$image`",severity=`"high`"} $high"
            Add-Content $metricsFile "trivy_vulnerabilities_total{image=`"$image`",severity=`"medium`"} $medium"
            Add-Content $metricsFile "trivy_vulnerabilities_total{image=`"$image`",severity=`"low`"} $low"
        }

      displayName: Generate Prometheus Metrics

        # Collect reports
    - powershell: |
        New-Item -ItemType Directory -Force -Path trivy-reports

        Move-Item trivy-api-report.json trivy-reports
        Move-Item trivy-frontend-report.json trivy-reports
        Move-Item trivy-source-report.json trivy-reports
      displayName: Collect Security Reports
      condition: always()

    # Publish reports
    - task: PublishBuildArtifacts@1
      displayName: Publish Security Reports
      condition: always()
      inputs:
        pathToPublish: trivy-reports
        artifactName: security-reports

# ==================================================
# DEPLOY
# ==================================================
- stage: Deploy
  displayName: Deploy Application
  dependsOn: SecurityScan

  jobs:
  - job: Deploy
    pool:
      name: Default

    steps:
    - powershell: |
        docker compose -p km-praktyki up -d

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
      displayName: Run application stack
      
    - powershell: |
        Invoke-WebRequest `
          -Uri http://localhost:9091/metrics/job/trivy-scan `
          -Method POST `
          -InFile trivy-metrics.prom
      displayName: Push Metrics To Pushgateway

# ==================================================
# PUSH TO DEV
# ==================================================

- stage: PushDev
  displayName: Push Images To DEV
  dependsOn: Deploy

  jobs:
  - job: Push
    pool:
      name: Default

    steps:

    - powershell: |
        docker tag km-praktyki-api:latest knsberg.azurecr.io/praktyki-api:$(Build.BuildId)

        docker tag km-praktyki-frontend:latest knsberg.azurecr.io/praktyki-frontend:$(Build.BuildId)

        docker tag grafana/grafana-enterprise:latest knsberg.azurecr.io/praktyki-grafana:$(Build.BuildId)

        docker tag postgres:16-alpine knsberg.azurecr.io/praktyki-postgres:$(Build.BuildId)

        docker tag prom/prometheus:latest knsberg.azurecr.io/praktyki-prom:$(Build.BuildId)
      displayName: Tag images for DEV

    - task: Docker@2
      displayName: Push API DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-api
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Frontend DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-frontend
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push DB DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-postgres
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Prometheus DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-prom
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Grafana DEV
      inputs:
        command: push
        containerRegistry: dev
        repository: praktyki-grafana
        tags: |
          $(Build.BuildId)

# ==================================================
# PUSH TO DEV
# ==================================================

- stage: PushProd
  displayName: Push Images to PROD
  condition: and(succeeded(), eq( stageDependencies.SecurityScan.Scan.outputs['ParseReports.CriticalCount'],'0' ))
  dependsOn: PushDev
  jobs:
  - job: PushProd
    pool:
      name: Default

    steps:

    - powershell: |
        docker tag km-praktyki-api:latest kmprod.azurecr.io/praktyki-api:$(Build.BuildId)

        docker tag km-praktyki-frontend:latest kmprod.azurecr.io/praktyki-frontend:$(Build.BuildId)

        docker tag grafana/grafana-enterprise:latest kmprod.azurecr.io/praktyki-grafana:$(Build.BuildId)

        docker tag postgres:16-alpine kmprod.azurecr.io/praktyki-postgres:$(Build.BuildId)

        docker tag prom/prometheus:latest kmprod.azurecr.io/praktyki-prom:$(Build.BuildId)
      displayName: Tag images for PROD

    - task: Docker@2
      displayName: Push API PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-api
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Frontend PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-frontend
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push DB PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-postgres
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Prometheus PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-prom
        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: Push Grafana PROD
      inputs:
        command: push
        containerRegistry: prod
        repository: praktyki-grafana
        tags: |
          $(Build.BuildId)

# ==================================================
# DIAGNOSTICS
# ==================================================
- stage: Diagnostics
  displayName: Diagnostics
  dependsOn: Deploy

  jobs:
  - job: Diagnostics
    pool:
      name: Default

    steps:
    - powershell: |
        docker images
        docker ps -a
      displayName: Diagnostics