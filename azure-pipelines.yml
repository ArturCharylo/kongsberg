trigger:
  - master

pool:
  name: Default

steps:
- checkout: self

- powershell: |
    docker compose down --remove-orphans
    docker rm -f km-praktyki-app 2>$null
    if ($LASTEXITCODE -ne 0) {
      $global:LASTEXITCODE = 0
    }
  displayName: Stop previous application stack

- powershell: |
    docker compose build --pull
    if ($LASTEXITCODE -ne 0) {
      exit $LASTEXITCODE
    }

    docker compose up -d
    if ($LASTEXITCODE -ne 0) {
      exit $LASTEXITCODE
    }
  displayName: Build and run application stack

- powershell: |
    docker images
    docker ps -a
  displayName: Diagnostics