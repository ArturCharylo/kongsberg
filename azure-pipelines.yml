trigger:
  - master

variables:
  - group: km
  - name: COSIGN_VERSION
    value: 'v2.4.1'

stages:

# ==================================================
# BUILD & HELM VALIDATION
# ==================================================
- stage: BuildAndValidate
  displayName: Build & Validate
  jobs:
  - job: Build
    pool:
      name: Default
    steps:
    - powershell: |
        docker compose -p km-praktyki build --pull
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Build Application Stack

    - powershell: |
        helm lint .\praktyki
        helm template praktyki .\praktyki > rendered.yaml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Helm Lint and Template Validation

# ==================================================
# TESTS AND COVERAGE
# ==================================================
- stage: Tests
  displayName: Tests and Code Coverage
  dependsOn: BuildAndValidate
  jobs:
  - job: Tests
    pool:
      name: Default
    steps:
    # 1. Backend tests & coverage
    - powershell: |
        python -m pip install -r "$(Build.SourcesDirectory)\backend\requirements-test.txt"
        Set-Location "$(Build.SourcesDirectory)"
        python -m pytest backend/tests `
          --cov=backend `
          --cov-report=term `
          --cov-report=html:backend\htmlcov `
          --cov-report=xml:backend\coverage.xml `
          --cov-report=json:backend\coverage.json `
          --junitxml=backend\test-results.xml
      displayName: Run backend tests with coverage

    - task: PublishTestResults@2
      displayName: Publish backend test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'backend/test-results.xml'
        testRunTitle: Backend tests

    - task: PublishCodeCoverageResults@2
      displayName: Publish backend coverage (Code Coverage Tab)
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/backend/coverage.xml'
        pathToSources: '$(Build.SourcesDirectory)/backend'
        reportDirectory: '$(Build.SourcesDirectory)/backend/htmlcov'

    # 2. Frontend tests, coverage & lint
    - powershell: |
        Set-Location "$(Build.SourcesDirectory)\km_Praktyki"
        npm ci
        npm run test:coverage -- --reporter=junit --outputFile=test-results\frontend-junit.xml --coverage.reporter=cobertura --coverage.reporter=json-summary
        npm run lint -- --format json --output-file eslint-report.json
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ESLint reported issues, but pipeline continues."
        }
      displayName: Run frontend tests, coverage and lint
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      displayName: Publish frontend test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'km_Praktyki/test-results/frontend-junit.xml'
        testRunTitle: Frontend tests

    - task: PublishCodeCoverageResults@2
      displayName: Publish frontend coverage (Code Coverage Tab)
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/km_Praktyki/coverage/cobertura-coverage.xml'
        pathToSources: '$(Build.SourcesDirectory)/km_Praktyki'
        reportDirectory: '$(Build.SourcesDirectory)/km_Praktyki/coverage'

    # 3. Static analysis metrics for Prometheus/Grafana
    - powershell: |
        Set-Location "$(Build.SourcesDirectory)"
        if (Test-Path "km_Praktyki\eslint-report.json") {
          python km_Praktyki\scripts\eslint_to_prometheus.py `
            km_Praktyki\eslint-report.json `
            web-static-analysis-metrics.prom
        }
      displayName: Generate static analysis metrics
      condition: succeededOrFailed()

    # 4. Generate & Upload Markdown to Pipeline Summary Tab 
    - powershell: |
        @'
        import json
        from pathlib import Path

        b_pct = 0.0
        f_pct = 0.0

        b_path = Path('backend/coverage.json')
        if b_path.exists():
            try:
                data = json.loads(b_path.read_text(encoding='utf-8'))
                b_pct = round(data.get('totals', {}).get('percent_covered', 0.0), 2)
            except Exception as e:
                print(f"Error parsing backend coverage: {e}")

        f_path = Path('km_Praktyki/coverage/coverage-summary.json')
        if f_path.exists():
            try:
                data = json.loads(f_path.read_text(encoding='utf-8'))
                f_pct = round(data.get('total', {}).get('lines', {}).get('pct', 0.0), 2)
            except Exception as e:
                print(f"Error parsing frontend coverage: {e}")

        avg = round((b_pct + f_pct) / 2, 2)

        summary_content = '\n'.join([
            '# Test and Code Coverage Summary',
            '',
            '| Area | Engine / Framework | Line Coverage |',
            '| :--- | :--- | ---: |',
            f'| **Backend** | pytest | {b_pct}% |',
            f'| **Frontend** | Vitest | {f_pct}% |',
            f'| **Total Average** | | **{avg}%** |',
            '',
            '*Detailed reports are available in the Code Coverage tab and published build artifacts.*',
            ''
        ])

        Path('test-coverage-summary.md').write_text(summary_content, encoding='utf-8')
        '@ | python -

        Write-Host "##vso[task.uploadsummary]$(Build.SourcesDirectory)\test-coverage-summary.md"
      displayName: Add Coverage Table to Pipeline Summary Tab
      condition: succeededOrFailed(

# ==================================================
# SECURITY & SBOM SCAN
# ==================================================
- stage: SecurityScan
  displayName: Security & SBOM Scan
  dependsOn: Tests
  jobs:
  - job: Scan
    pool:
      name: Default
    steps:
    - powershell: |
        New-Item -ItemType Directory -Force -Path "security-reports", "sbom-reports" | Out-Null

        $trivy = "C:\ProgramData\chocolatey\bin\trivy.exe"
        $targets = @(
          @{ Name = 'api'; Image = 'km-praktyki-api:latest' },
          @{ Name = 'frontend'; Image = 'km-praktyki-frontend:latest' }
        )

        # 1. Vulnerability and CycloneDX SBOM scans
        foreach ($t in $targets) {
          & $trivy image --format json --output "security-reports/trivy-$($t.Name)-report.json" $t.Image
          & $trivy image --format cyclonedx --output "sbom-reports/sbom-$($t.Name).json" $t.Image
        }
        & $trivy fs --format json --output "security-reports/trivy-source-report.json" .

        # 2. Parse severity and build Prometheus metrics
        $critical = 0
        $high = 0
        $vulnMetrics = @()
        $jsonReports = @{
          'api'      = 'security-reports/trivy-api-report.json'
          'frontend' = 'security-reports/trivy-frontend-report.json'
          'source'   = 'security-reports/trivy-source-report.json'
        }

        foreach ($image in $jsonReports.Keys) {
          if (Test-Path $jsonReports[$image]) {
            $json = Get-Content $jsonReports[$image] -Raw | ConvertFrom-Json
            $counts = @{ 'critical' = 0; 'high' = 0; 'medium' = 0; 'low' = 0 }

            foreach ($res in $json.Results) {
              foreach ($v in $res.Vulnerabilities) {
                $sev = $v.Severity.ToLowerInvariant()
                if ($counts.ContainsKey($sev)) { $counts[$sev]++ }
                if ($sev -eq 'critical') { $critical++ }
                if ($sev -eq 'high') { $high++ }
              }
            }

            foreach ($sev in $counts.Keys) {
              $vulnMetrics += "trivy_vulnerabilities_total{image=`"$image`",severity=`"$sev`"} $($counts[$sev])"
            }
          }
        }

        [IO.File]::WriteAllText("trivy-metrics.prom", ($vulnMetrics -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
        Write-Host "Vulnerabilities parsed: Critical=$critical, High=$high"
        Write-Host "##vso[task.setvariable variable=CriticalCount;isOutput=true]$critical"

        # 3. Generate SBOM Prometheus metrics
        function Escape-Label([string]$val) {
          return ($val -replace '\\', '\\' -replace '"', '\"' -replace "`r", '' -replace "`n", '')
        }

        $sbomMetrics = @()
        foreach ($name in @('api', 'frontend')) {
          $file = "sbom-reports/sbom-$name.json"
          if (Test-Path $file) {
            $sbom = Get-Content $file -Raw | ConvertFrom-Json
            $components = @($sbom.components)
            foreach ($c in $components) {
              $pkg = Escape-Label $c.name
              $ver = Escape-Label $c.version
              $sbomMetrics += "sbom_component_info{image=`"$name`",package=`"$pkg`",version=`"$ver`"} 1"
            }
            $sbomMetrics += "sbom_components_total{image=`"$name`"} $($components.Count)"
          }
        }

        [IO.File]::WriteAllText("sbom-metrics.prom", ($sbomMetrics -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      displayName: Scan Vulnerabilities, Generate SBOM and Prometheus Metrics
      name: ParseReports
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Publish Security & SBOM Reports
      inputs:
        pathToPublish: security-reports
        artifactName: security-reports
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Publish SBOM Reports
      inputs:
        pathToPublish: sbom-reports
        artifactName: sbom-reports
      condition: always()

    - powershell: |
        New-Item -ItemType Directory -Force -Path "ci-metrics" | Out-Null
        Copy-Item "*.prom" -Destination "ci-metrics" -Force
      displayName: Stage Prometheus Metrics

    - task: PublishBuildArtifacts@1
      displayName: Publish All CI Metrics
      inputs:
        pathToPublish: ci-metrics
        artifactName: ci-metrics
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Publish Grafana Monitoring Configuration
      inputs:
        pathToPublish: monitoring
        artifactName: grafana-monitoring
      condition: succeededOrFailed()

# ==================================================
# DEPLOY TO DEV
# ==================================================
- stage: PushDev
  displayName: Deploy to DEV
  dependsOn: SecurityScan
  jobs:
  - job: DeployDev
    pool:
      name: Default
    steps:
    - template: templates/deploy-env.yml
      parameters:
        environment: 'dev'
        acrServer: 'knsberg.azurecr.io'
        acrServiceConnection: 'dev'
        acrUsername: $(DEV_ACR_USERNAME)
        acrPassword: $(DEV_ACR_PASSWORD)

# ==================================================
# DEPLOY TO PROD
# ==================================================
- stage: PushProd
  displayName: Deploy to PROD
  dependsOn:
    - PushDev
    - SecurityScan
  condition: and(succeeded(), eq(stageDependencies.SecurityScan.Scan.outputs['ParseReports.CriticalCount'], '0'))
  jobs:
  - job: DeployProd
    pool:
      name: Default
    steps:
    - template: templates/deploy-env.yml
      parameters:
        environment: 'prod'
        acrServer: 'kmprod.azurecr.io'
        acrServiceConnection: 'prod'
        acrUsername: $(PROD_ACR_USERNAME)
        acrPassword: $(PROD_ACR_PASSWORD)