services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: textsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d textsdb']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/textsdb
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: km-praktyki-app
    build:
      context: ./km_Praktyki
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
