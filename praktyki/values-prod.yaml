imagePullSecrets:
  - acr-pull-secret

api:
  image:
    repository: kmprod.azurecr.io/praktyki-api
  frontendOrigin: "https://frontend.local"

frontend:
  image:
    repository: kmprod.azurecr.io/praktyki-frontend

postgres:
  image:
    repository: kmprod.azurecr.io/praktyki-postgres

prometheus:
  image:
    repository: kmprod.azurecr.io/praktyki-prom
  externalUrl: "https://prometheus.local"

grafana:
  image:
    repository: kmprod.azurecr.io/praktyki-grafana

  server:
    rootUrl: "https://grafana.local"
    domain: grafana.local

ingress:
  tls:
    enabled: false
    secretName: praktyki-tls

  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod
