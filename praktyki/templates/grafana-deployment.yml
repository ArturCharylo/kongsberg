apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10

  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
      - name: {{ . }}
      {{- end }}
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}{{ if .Values.grafana.image.digest }}@{{ .Values.grafana.image.digest }}{{ else }}:{{ .Values.grafana.image.tag }}{{ end }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.admin.existingSecret | default .Values.grafana.admin.secretName }}
              key: user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.admin.existingSecret | default .Values.grafana.admin.secretName }}
              key: password
        - name: GF_METRICS_ENABLED
          value: "true"
        - name: GF_SERVER_ROOT_URL
          value: {{ .Values.grafana.server.rootUrl | quote }}
        - name: GF_SERVER_DOMAIN
          value: {{ .Values.grafana.server.domain | quote }}
        - name: AZURE_DEVOPS_PAT
          valueFrom:
            secretKeyRef:
              name: {{ .Values.grafana.alerting.existingSecret | default "grafana-alerting" }}
              key: azure-devops-pat
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
          subPath: prometheus.yml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/provider.yml
          subPath: provider.yml
        - name: config
          mountPath: /etc/grafana/provisioning/alerting/alerting.yml
          subPath: alerting.yml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: config
        configMap:
          name: grafana-config
      - name: dashboards
        configMap:
          name: {{ .Values.grafana.dashboards.configMapName }}