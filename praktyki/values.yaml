imagePullSecrets:
  []

api:
  replicaCount: 2

  image:
    repository: ""
    tag: latest

  frontendOrigin: "http://frontend.local"

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2

  image:
    repository: ""
    tag: latest

  service:
    type: ClusterIP
    port: 80

postgres:
  replicaCount: 1

  image:
    repository: ""
    tag: latest

  database: textsdb
  username: postgres

  auth:
    existingSecret: ""
    secretName: postgres
    database: textsdb
    username: postgres
    password: change-me

  persistence:
    enabled: true
    size: 1Gi

prometheus:
  enabled: true

  image:
    repository: ""
    tag: latest

  externalUrl: "http://prometheus.local"

grafana:
  enabled: true

  image:
    repository: ""
    tag: latest

  service:
    type: ClusterIP
    port: 3000

  server:
    rootUrl: "http://grafana.local"
    domain: grafana.local

  admin:
    existingSecret: ""
    secretName: grafana-admin
    user: admin
    password: change-me

  dashboards:
    configMapName: grafana-dashboards

ingress:
  enabled: true

  className: nginx
  hosts:
    frontend: frontend.local
    api: api.local
    grafana: grafana.local
    prometheus: prometheus.local

  annotations: {}

  tls:
    enabled: false
    secretName: praktyki-tls

  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod

  adminUser: admin
  adminPassword: admin