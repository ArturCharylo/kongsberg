imagePullSecrets:
  - acr-pull-secret

api:
  replicaCount: 2

  image:
    repository: ""
    tag: latest

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2

  image:
    repository: ""
    tag: latest

  service:
    type: NodePort
    port: 80

postgres:
  replicaCount: 1

  image:
    repository: ""
    tag: latest

  database: textsdb
  username: postgres

  persistence:
    enabled: true
    size: 1Gi

prometheus:
  enabled: true

  image:
    repository: ""
    tag: latest

grafana:
  enabled: true

  image:
    repository: ""
    tag: latest

  service:
    type: NodePort
    port: 3000

  adminUser: admin
  adminPassword: admin