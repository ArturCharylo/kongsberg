parameters:
  - name: environment
    type: string
  - name: acrServer
    type: string
  - name: acrServiceConnection
    type: string
  - name: acrUsername
    type: string
  - name: acrPassword
    type: string

steps:
- checkout: self

- task: Docker@2
  displayName: Login to ACR
  inputs:
    command: login
    containerRegistry: ${{ parameters.acrServiceConnection }}

- powershell: |
    $images = @('api', 'frontend', 'postgres', 'prom', 'grafana')
    $sourceNames = @{
      'api' = 'km-praktyki-api:latest'
      'frontend' = 'km-praktyki-frontend:latest'
      'postgres' = 'postgres:16-alpine'
      'prom' = 'prom/prometheus:latest'
      'grafana' = 'grafana/grafana-enterprise:latest'
    }

    foreach ($name in $images) {
      $target = "${{ parameters.acrServer }}/praktyki-${name}:$($env:BUILD_BUILDID)"
      docker tag $sourceNames[$name] $target
      docker push $target
      if ($LASTEXITCODE -ne 0) { throw "Failed to push $target" }

      # Pull remote digest & export as output variable
      $repoDigests = docker inspect --format='{{range .RepoDigests}}{{.}} {{end}}' $target
      $matched = ($repoDigests -split '\s+' | Where-Object { $_ -like "*${{ parameters.acrServer }}/*@sha256:*" } | Select-Object -First 1)
      if (-not $matched) {
        $matched = ($repoDigests -split '\s+' | Where-Object { $_ -match '@sha256:[0-9a-f]{64}$' } | Select-Object -First 1)
      }
      $digest = $matched.Substring($matched.IndexOf('@') + 1)
      Write-Host "$name digest: $digest"
      Write-Host "##vso[task.setvariable variable=$($name.ToUpper())_IMAGE_DIGEST]$digest"
    }
  displayName: Tag, Push and Capture Digests

- task: AzureKeyVault@2
  displayName: Download Ingress TLS and Cosign Keys
  inputs:
    azureSubscription: 'key-vault'
    KeyVaultName: 'kongsberg'
    SecretsFilter: 'ingress-tls,cosign-private-key,cosign-public-key'
    RunAsPreJob: false

- powershell: |
    $ErrorActionPreference = 'Stop'
    $utf8 = [Text.UTF8Encoding]::new($false)

    # 1. Setup Cosign keys
    [IO.File]::WriteAllText("$(Build.SourcesDirectory)\cosign.key", "$env:COSIGN_PRIVATE_KEY`n", $utf8)
    [IO.File]::WriteAllText("$(Build.SourcesDirectory)\cosign.pub", "$env:COSIGN_PUBLIC_KEY`n", $utf8)

    # 2. Extract TLS Cert and Key
    $certDir = Join-Path $env:AGENT_TEMPDIRECTORY 'tls-${{ parameters.environment }}'
    New-Item -ItemType Directory -Force -Path $certDir | Out-Null
    $pfxPath = Join-Path $certDir 'tls.pfx'
    [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("$(ingress-tls)"))

    $certPath    = Join-Path $certDir 'ingress.crt'
    $chainPath   = Join-Path $certDir 'chain.crt'
    $keyPath     = Join-Path $certDir 'ingress.key'
    $fullChain   = Join-Path $certDir 'fullchain.crt'

    openssl pkcs12 -in $pfxPath -clcerts -nokeys -out $certPath -passin pass:
    openssl pkcs12 -in $pfxPath -cacerts -nokeys -out $chainPath -passin pass:
    openssl pkcs12 -in $pfxPath -nocerts -nodes -out $keyPath -passin pass:

    # Combine certs into full chain
    $combined = (Get-Content $certPath -Raw) + (Get-Content $chainPath -Raw)
    [IO.File]::WriteAllText($fullChain, $combined, $utf8)

    # 3. Apply Secrets to K8s with securely quoted variables
    kubectl create namespace ${{ parameters.environment }} --dry-run=client -o yaml | kubectl apply -f -

    kubectl create secret docker-registry acr-pull-secret `
      --docker-server=${{ parameters.acrServer }} `
      --docker-username="${{ parameters.acrUsername }}" `
      --docker-password="${{ parameters.acrPassword }}" `
      --namespace ${{ parameters.environment }} `
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl create secret tls praktyki-tls `
      --namespace ${{ parameters.environment }} `
      --cert="$fullChain" `
      --key="$keyPath" `
      --dry-run=client -o yaml | kubectl apply -f -
  displayName: Provision Keys and K8s Secrets
  env:
    COSIGN_PRIVATE_KEY: $(cosign-private-key)
    COSIGN_PUBLIC_KEY: $(cosign-public-key)

- powershell: |
    helm upgrade --install praktyki-${{ parameters.environment }} `
      "$(Build.SourcesDirectory)\praktyki" `
      -f "$(Build.SourcesDirectory)\praktyki\values-${{ parameters.environment }}.yaml" `
      --namespace ${{ parameters.environment }} `
      --create-namespace `
      --set-string api.image.digest=$(API_IMAGE_DIGEST) `
      --set-string frontend.image.digest=$(FRONTEND_IMAGE_DIGEST) `
      --set-string postgres.image.digest=$(POSTGRES_IMAGE_DIGEST) `
      --set-string prometheus.image.digest=$(PROM_IMAGE_DIGEST) `
      --set-string grafana.image.digest=$(GRAFANA_IMAGE_DIGEST)
  displayName: Deploy with Helm

- powershell: |
    $deployments = @('api', 'frontend', 'postgres', 'prometheus', 'grafana')
    foreach ($dep in $deployments) {
      kubectl rollout status "deployment/$dep" --namespace ${{ parameters.environment }} --timeout=180s
      if ($LASTEXITCODE -ne 0) { throw "Rollout failed for $dep" }
    }
  displayName: Verify Rollouts